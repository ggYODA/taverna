<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>С 8 марта, мамочка! ❤️</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Caveat', cursive;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      background: #f5f0e8;
      background-image:
        radial-gradient(ellipse at 50% 50%, rgba(255,240,230,0.5) 0%, transparent 70%),
        repeating-linear-gradient(
          0deg, transparent, transparent 29px,
          rgba(200,180,160,0.06) 29px, rgba(200,180,160,0.06) 30px
        );
    }

    /* ========================
       ЛЕТАЮЩИЕ СЕРДЕЧКИ
       ======================== */
    .floating-hearts {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .floating-heart {
      position: absolute;
      color: #e74c6f;
      pointer-events: none;
      user-select: none;
      animation: floatHeart linear infinite;
    }

    @keyframes floatHeart {
      0% { transform: translateY(105vh) rotate(0deg) scale(1); opacity: 0; }
      5% { opacity: var(--heart-opacity); }
      90% { opacity: var(--heart-opacity); }
      100% { transform: translateY(-10vh) rotate(360deg) scale(0.7); opacity: 0; }
    }

    /* ========================
       КОНТЕЙНЕР СЦЕН
       ======================== */
    .scene-container {
      position: relative;
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    /* ========================
       СТРАНИЦА 1 — ОБЛОЖКА
       ======================== */
    .cover-scene {
      position: absolute;
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease;
    }

    /* Книжка-обложка — цельная карточка */
    .card-cover {
      position: relative;
      width: min(480px, 85vw);
      height: min(620px, 82vh);
      background: #fff8f0;
      border-radius: 8px 14px 14px 8px;
      box-shadow:
        5px 6px 30px rgba(0,0,0,0.16),
        0 0 40px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 30px;
      background-image:
        radial-gradient(ellipse at 60% 35%, rgba(255,230,230,0.2) 0%, transparent 50%);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .card-cover.hiding {
      opacity: 0;
      transform: scale(0.95);
    }

    /* Рисунки по углам обложки */
    .corner-doodle {
      position: absolute;
      font-size: 1.4rem;
      opacity: 0.2;
    }
    .corner-doodle.c1 { top: 20px; left: 24px; transform: rotate(-15deg); }
    .corner-doodle.c2 { top: 20px; right: 24px; transform: rotate(10deg); }
    .corner-doodle.c3 { bottom: 24px; left: 24px; transform: rotate(5deg); }
    .corner-doodle.c4 { bottom: 24px; right: 24px; transform: rotate(-8deg); }

    .cover-title {
      font-size: clamp(3rem, 8vw, 4.5rem);
      font-weight: 700;
      color: #e53935;
      text-align: center;
      line-height: 1.2;
      text-shadow:
        2px 2px 0 rgba(229,57,53,0.25),
        -1px 1px 0 rgba(229,57,53,0.1);
      transform: rotate(-3deg);
      margin-bottom: 16px;
      position: relative;
    }

    .cover-flower {
      position: absolute;
      font-size: 1.8rem;
      animation: gentleSway 4s ease-in-out infinite;
    }
    .cover-flower.f1 { top: -12px; right: -28px; }
    .cover-flower.f2 { bottom: -10px; left: -24px; animation-delay: 1.5s; }
    .cover-flower.f3 { top: 45%; right: -36px; animation-delay: 0.8s; font-size: 1.3rem; }
    .cover-flower.f4 { top: -16px; left: -20px; animation-delay: 2s; font-size: 1.2rem; }

    @keyframes gentleSway {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(10deg); }
    }

    .cover-doodles {
      font-size: 1.8rem;
      letter-spacing: 8px;
      margin: 12px 0;
      opacity: 0.7;
      animation: doodlePulse 3s ease-in-out infinite;
    }

    @keyframes doodlePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    .btn-handdrawn {
      font-family: 'Caveat', cursive;
      font-size: 1.8rem;
      color: #e53935;
      background: transparent;
      border: 3px dashed #e53935;
      border-radius: 16px 22px 14px 20px;
      padding: 12px 40px;
      cursor: pointer;
      margin-top: 28px;
      transition: all 0.3s;
      position: relative;
      transform: rotate(1deg);
    }

    .btn-handdrawn:hover {
      background: rgba(229,57,53,0.07);
      transform: rotate(-1deg) scale(1.06);
    }

    .btn-stars {
      position: absolute;
      font-size: 0.9rem;
      opacity: 0.5;
    }
    .btn-stars.s1 { top: -12px; right: -10px; }
    .btn-stars.s2 { bottom: -10px; left: -12px; }

    /* ========================
       СТРАНИЦА 2 — ОТКРЫТАЯ КНИГА
       ======================== */
    .open-scene {
      position: absolute;
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .open-scene.active {
      opacity: 1;
      pointer-events: auto;
    }

    .open-book {
      display: flex;
      width: min(940px, 96vw);
      height: min(580px, 82vh);
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      box-shadow:
        0 10px 50px rgba(0,0,0,0.18),
        0 2px 8px rgba(0,0,0,0.08);
    }

    /* Тонкая еле заметная линия-корешок между страницами */
    .open-book::after {
      content: '';
      position: absolute;
      left: 50%; top: 3%;
      transform: translateX(-50%);
      width: 1px; height: 94%;
      background: rgba(0,0,0,0.08);
      z-index: 5;
      pointer-events: none;
    }

    /* Общий стиль страницы */
    .page {
      flex: 1;
      background: #fff8f0;
      padding: clamp(20px, 3vw, 36px);
      display: flex;
      flex-direction: column;
      position: relative;
      background-image:
        radial-gradient(ellipse at 50% 50%, rgba(255,240,230,0.3) 0%, transparent 70%);
    }

    .page-left {
      align-items: flex-start;
      justify-content: flex-start;
      border-radius: 8px 0 0 8px;
    }

    .page-right {
      align-items: flex-start;
      justify-content: flex-start;
      border-radius: 0 8px 8px 0;
      overflow: hidden;
    }

    /* Декоративные элементы — одинаковые на обеих страницах */
    .page-deco {
      position: absolute;
      opacity: 0.18;
      animation: gentleSway 5s ease-in-out infinite;
    }

    /* Левая — декор */
    .page-left .pd1 { top: 5%; right: 8%; font-size: 1.4rem; color: #e74c6f; }
    .page-left .pd2 { bottom: 8%; left: 8%; font-size: 1.2rem; color: #f9a825; animation-delay: 1s; }
    .page-left .pd3 { bottom: 20%; right: 12%; font-size: 1.1rem; color: #f48fb1; animation-delay: 2s; }
    .page-left .pd4 { top: 40%; right: 5%; font-size: 1rem; color: #ef5350; animation-delay: 0.5s; }

    /* Правая — такие же */
    .page-right .pd1 { top: 5%; left: 8%; font-size: 1.4rem; color: #e74c6f; }
    .page-right .pd2 { bottom: 8%; right: 8%; font-size: 1.2rem; color: #f9a825; animation-delay: 1s; }
    .page-right .pd3 { bottom: 20%; left: 12%; font-size: 1.1rem; color: #f48fb1; animation-delay: 2s; }
    .page-right .pd4 { top: 40%; left: 5%; font-size: 1rem; color: #ef5350; animation-delay: 0.5s; }

    /* Фотография со скотчем — в верхнем левом углу */
    .photo-frame {
      position: relative;
      width: clamp(140px, 28vw, 210px);
      height: clamp(140px, 28vw, 210px);
      margin-bottom: 14px;
      flex-shrink: 0;
    }

    .photo-frame img {
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 4px;
      box-shadow: 2px 3px 12px rgba(0,0,0,0.15);
    }

    .tape {
      position: absolute;
      width: 58px; height: 22px;
      background: linear-gradient(135deg,
        rgba(255,255,255,0.4) 0%, rgba(255,255,240,0.25) 40%,
        rgba(255,255,255,0.45) 60%, rgba(255,255,240,0.2) 100%
      );
      border: 1px solid rgba(200,200,180,0.3);
      border-radius: 2px;
      z-index: 2;
      animation: tapeShimmer 3.5s ease-in-out infinite;
    }

    .tape-top {
      top: -10px; left: 50%;
      transform: translateX(-50%) rotate(-2deg);
    }

    .tape-bottom {
      bottom: -10px; right: 14%;
      transform: rotate(3deg);
      animation-delay: 1.7s;
    }

    @keyframes tapeShimmer {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }

    /* Стихотворение — столбиком, компактно */
    .poem-text {
      text-align: left;
      font-size: clamp(1.05rem, 2.2vw, 1.35rem);
      color: #555;
      line-height: 1.15;
      margin-top: 6px;
      overflow: hidden;
    }

    .poem-text .line {
      display: block;
      opacity: 0;
      transform: translateY(8px);
    }

    .poem-text .line.show {
      animation: fadeInLine 0.4s ease forwards;
    }

    .poem-text .heart-line {
      color: #e53935;
      font-size: 1.15em;
      margin-top: 2px;
    }

    @keyframes fadeInLine {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Правая страница — текст столбиком + фото */
    .right-photo-frame {
      position: relative;
      width: clamp(140px, 28vw, 210px);
      height: clamp(140px, 28vw, 210px);
      margin-bottom: 14px;
      flex-shrink: 0;
    }

    .right-photo-frame img {
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 4px;
      box-shadow: 2px 3px 12px rgba(0,0,0,0.15);
    }

    .btn-next {
      font-family: 'Caveat', cursive;
      font-size: 1.5rem;
      color: #e53935;
      background: transparent;
      border: 2.5px dashed #e53935;
      border-radius: 18px 14px 20px 12px;
      padding: 8px 36px;
      cursor: pointer;
      transition: all 0.3s;
      transform: rotate(-1deg);
      margin-top: auto;
      align-self: center;
    }

    .btn-next:hover {
      background: rgba(229,57,53,0.07);
      transform: rotate(1deg) scale(1.06);
    }

    /* ========================
       СТРАНИЦА 3 — СЮРПРИЗ
       ======================== */
    .open-scene.lifting {
      transition: transform 1.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 1.5s ease 0.4s;
      transform: translateY(120vh) scale(0.7) rotateX(30deg);
      opacity: 0;
    }

    .surprise-scene {
      position: absolute;
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
      background: linear-gradient(180deg,
        #0a0a1a 0%, #0e0e28 40%, #161440 70%, #1c1648 100%
      );
    }

    .surprise-scene.active {
      opacity: 1;
      pointer-events: auto;
    }

    #fireworksCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }

    .final-text {
      font-size: clamp(2.2rem, 7vw, 4.5rem);
      font-weight: 700;
      color: #fff;
      text-align: center;
      z-index: 2;
      opacity: 0;
      transform: scale(0.6) translateY(30px);
      transition: opacity 2s cubic-bezier(0.22, 1, 0.36, 1), transform 2s cubic-bezier(0.22, 1, 0.36, 1);
      text-shadow:
        0 0 12px rgba(255,120,170,0.5),
        0 2px 4px rgba(0,0,0,0.4);
      line-height: 1.4;
      padding: 0 24px;
      will-change: opacity, transform;
    }

    .final-text.visible {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    .final-heart {
      display: inline-block;
      animation: heartBeat 1.2s ease-in-out infinite;
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.3); }
      30% { transform: scale(1); }
      45% { transform: scale(1.2); }
      60% { transform: scale(1); }
    }

    .stars {
      position: absolute;
      width: 100%; height: 100%;
      z-index: 0;
    }

    .star {
      position: absolute;
      width: 2px; height: 2px;
      background: #fff;
      border-radius: 50%;
      animation: twinkle 3s ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* МОБИЛЬНЫЕ */
    @media (max-width: 700px) {
      .open-book {
        flex-direction: column;
        width: 96vw;
        height: auto;
        max-height: 92vh;
        overflow-y: auto;
      }

      .page-left, .page-right {
        border-radius: 0;
        padding: 18px 16px;
      }

      .open-book::after {
        left: 3%; top: auto;
        bottom: 50%;
        transform: none;
        width: 94%; height: 1px;
      }

      .photo-frame, .right-photo-frame {
        width: clamp(100px, 30vw, 140px);
        height: clamp(100px, 30vw, 140px);
      }

      .card-cover {
        width: min(360px, 88vw);
        height: min(500px, 78vh);
      }

      .cover-title {
        font-size: clamp(2.4rem, 8vw, 3.5rem);
      }

      .poem-text {
        font-size: clamp(1rem, 4.5vw, 1.3rem);
      }

      .final-text {
        font-size: clamp(1.8rem, 7vw, 3rem);
      }
    }
  </style>
</head>

<body>

  <!-- ЛЕТАЮЩИЕ СЕРДЕЧКИ -->
  <div class="floating-hearts" id="floatingHearts"></div>

  <div class="scene-container">

    <!-- ========================
         СТРАНИЦА 1 — ОБЛОЖКА
         ======================== -->
    <div class="cover-scene" id="coverScene">
      <div class="card-cover" id="cardCover">
        <span class="corner-doodle c1">🌸</span>
        <span class="corner-doodle c2">⭐</span>
        <span class="corner-doodle c3">💕</span>
        <span class="corner-doodle c4">🌷</span>

        <div class="cover-title">
          С 8 марта!
          <span class="cover-flower f1">🌸</span>
          <span class="cover-flower f2">🌷</span>
          <span class="cover-flower f3">✨</span>
          <span class="cover-flower f4">⭐</span>
        </div>

        <div class="cover-doodles">❤️ 🌼 ⭐ 🌸 ❤️</div>

        <button class="btn-handdrawn" onclick="openCard()">
          Открыть 💌
          <span class="btn-stars s1">✨</span>
          <span class="btn-stars s2">⭐</span>
        </button>
      </div>
    </div>

    <!-- ========================
         СТРАНИЦА 2 — ОТКРЫТАЯ КНИГА
         ======================== -->
    <div class="open-scene" id="openScene">
      <div class="open-book">

        <!-- ЛЕВАЯ СТРАНИЦА -->
        <div class="page page-left">
          <!-- Декор (одинаковый на обеих страницах) -->
          <span class="page-deco pd1">❤️</span>
          <span class="page-deco pd2">🌼</span>
          <span class="page-deco pd3">⭐</span>
          <span class="page-deco pd4">🌸</span>

          <!-- Фото в верхнем левом углу -->
          <div class="photo-frame">
            <img
              src="photo1.jpg"
              alt="Фотография для мамы"
            >
            <div class="tape tape-top"></div>
            <div class="tape tape-bottom"></div>
          </div>

          <!-- Текст столбиком -->
          <div class="poem-text" id="poemText">
            <span class="line">Мамочка,</span>
            <span class="line">ты самая добрая,</span>
            <span class="line">красивая</span>
            <span class="line">и любимая!</span>
            <span class="line">Спасибо что ты</span>
            <span class="line heart-line">у меня есть ❤️</span>
          </div>
        </div>

        <!-- ПРАВАЯ СТРАНИЦА -->
        <div class="page page-right">
          <!-- Декор (зеркально, как на левой) -->
          <span class="page-deco pd1">❤️</span>
          <span class="page-deco pd2">🌼</span>
          <span class="page-deco pd3">⭐</span>
          <span class="page-deco pd4">🌸</span>

          <!-- Фото со скотчем -->
          <div class="right-photo-frame">
            <img
              src="photo2.jpg"
              alt="Фотография"
            >
            <div class="tape tape-top"></div>
            <div class="tape tape-bottom"></div>
          </div>

          <!-- Текст на правой странице -->
          <div class="poem-text" id="rightPoemText">
            <span class="line">Пусть каждый день</span>
            <span class="line">будет самым</span>
            <span class="line heart-line">лучшим! 🌷</span>
          </div>

          <!-- Кнопка внизу -->
          <button class="btn-next" onclick="showSurprise()">
            Дальше →
          </button>
        </div>
      </div>
    </div>

    <!-- ========================
         СТРАНИЦА 3 — СЮРПРИЗ
         ======================== -->
    <div class="surprise-scene" id="surpriseScene">
      <div class="stars" id="stars"></div>
      <canvas id="fireworksCanvas"></canvas>

      <div class="final-text" id="finalText">
        С 8 марта,<br>любимая мамочка
        <span class="final-heart">❤️</span>
      </div>
    </div>

  </div>

  <script>
    /* ========================================================
       JAVASCRIPT
       ======================================================== */

    // ========================
    // 1. ЛЕТАЮЩИЕ СЕРДЕЧКИ — сразу видны
    // ========================
    (function() {
      var container = document.getElementById('floatingHearts');
      var symbols = ['❤', '♥', '💕', '♡', '💗'];

      for (var i = 0; i < 25; i++) {
        var heart = document.createElement('span');
        heart.className = 'floating-heart';
        heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];

        var opacity = 0.1 + Math.random() * 0.15;
        heart.style.left = Math.random() * 100 + '%';
        heart.style.fontSize = (16 + Math.random() * 24) + 'px';
        heart.style.setProperty('--heart-opacity', opacity);
        heart.style.animationDuration = (12 + Math.random() * 16) + 's';
        heart.style.animationDelay = (Math.random() * 6) + 's';

        container.appendChild(heart);
      }
    })();

    // ========================
    // 2. ОТКРЫТИЕ — просто складывается и открывается книга
    // ========================
    function openCard() {
      var cardCover = document.getElementById('cardCover');
      var coverScene = document.getElementById('coverScene');
      var openScene = document.getElementById('openScene');

      // Карточка плавно исчезает
      cardCover.classList.add('hiding');

      // Через 400мс — сразу открытая книга
      setTimeout(function() {
        coverScene.style.opacity = '0';
        coverScene.style.pointerEvents = 'none';
        openScene.classList.add('active');
        animateLines();
      }, 400);
    }

    // ========================
    // 3. ПОЯВЛЕНИЕ СТРОК — на обеих страницах
    // ========================
    function animateLines() {
      var leftLines = document.querySelectorAll('#poemText .line');
      for (var i = 0; i < leftLines.length; i++) {
        (function(line, idx) {
          setTimeout(function() { line.classList.add('show'); }, idx * 200);
        })(leftLines[i], i);
      }
      var rightLines = document.querySelectorAll('#rightPoemText .line');
      var delay = leftLines.length * 200 + 300;
      for (var j = 0; j < rightLines.length; j++) {
        (function(line, idx) {
          setTimeout(function() { line.classList.add('show'); }, delay + idx * 200);
        })(rightLines[j], j);
      }
    }

    // ========================
    // 4. «ДАЛЬШЕ» — камера поднимается, потом фейерверк, потом текст
    // ========================
    function showSurprise() {
      var openScene = document.getElementById('openScene');
      var surpriseScene = document.getElementById('surpriseScene');
      var finalText = document.getElementById('finalText');

      // Показываем ночное небо
      surpriseScene.classList.add('active');
      surpriseScene.style.opacity = '1';
      createStars();

      // Книга уезжает вниз (камера поднимается)
      openScene.classList.add('lifting');

      // Через 1с — фейерверки (быстрые, заполняют небо)
      setTimeout(function() {
        initFireworks();
      }, 800);

      // Убираем лишнее
      setTimeout(function() {
        openScene.style.display = 'none';
        document.getElementById('floatingHearts').style.display = 'none';
      }, 2000);

      // Текст появляется ПОСЛЕ фейерверков (через 4.5с)
      setTimeout(function() {
        finalText.classList.add('visible');
      }, 4500);
    }

    // ========================
    // 5. ЗВЁЗДЫ
    // ========================
    function createStars() {
      var container = document.getElementById('stars');
      for (var i = 0; i < 80; i++) {
        var star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        var s = (1 + Math.random() * 2) + 'px';
        star.style.width = s;
        star.style.height = s;
        star.style.animationDelay = Math.random() * 4 + 's';
        star.style.animationDuration = (2 + Math.random() * 3) + 's';
        container.appendChild(star);
      }
    }

    // ========================
    // 6. ФЕЙЕРВЕРК — снизу вверх, мы смотрим с земли
    // ========================
    function initFireworks() {
      var canvas = document.getElementById('fireworksCanvas');
      var ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      var particles = [];
      var rockets = [];
      var sparks = [];
      var animating = true;

      var colors = [
        '#ff4081', '#ff6b9d', '#ff3366', '#ff9a9e',
        '#ffd700', '#ffa726', '#ffeb3b',
        '#e040fb', '#ab47bc', '#ce93d8',
        '#40c4ff', '#80d8ff',
        '#ff5252', '#ff8a80',
        '#ffffff', '#ffe0b2'
      ];

      function Particle(x, y, color, speed, angle, type) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.type = type || 'normal';
        var sp = speed || (2 + Math.random() * 5);
        var a = angle !== undefined ? angle : Math.random() * Math.PI * 2;
        this.vx = Math.cos(a) * sp;
        this.vy = Math.sin(a) * sp;
        this.alpha = 1;
        this.decay = 0.012 + Math.random() * 0.018;
        this.size = type === 'sparkle' ? (1 + Math.random()) : (1.5 + Math.random() * 2.5);
        this.gravity = 0.035;
        this.friction = 0.98;
      }

      Particle.prototype.update = function() {
        this.vx *= this.friction;
        this.vy *= this.friction;
        this.vy += this.gravity;
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
        if (this.type !== 'sparkle') this.size *= 0.994;
      };

      Particle.prototype.draw = function() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, Math.max(0.5, this.size), 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      };

      // Ракета — летит снизу вверх (мы смотрим с земли)
      function Rocket() {
        // Стартует снизу экрана
        this.x = canvas.width * (0.1 + Math.random() * 0.8);
        this.y = canvas.height + 20;
        // Взрывается в верхней части (20–60% высоты от верха)
        this.targetY = canvas.height * (0.08 + Math.random() * 0.35);
        this.speed = 6 + Math.random() * 5; // Быстрые
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.exploded = false;
        this.trail = [];
        // Летит почти вертикально вверх с небольшим отклонением
        this.angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.25;
        this.vx = Math.cos(this.angle) * this.speed;
        this.vy = Math.sin(this.angle) * this.speed;
      }

      Rocket.prototype.update = function() {
        if (!this.exploded) {
          this.trail.push({ x: this.x, y: this.y, alpha: 0.7 });
          if (this.trail.length > 15) this.trail.shift();

          this.x += this.vx;
          this.y += this.vy;
          this.vy += 0.015;

          // Искры от хвоста (реже)
          if (Math.random() > 0.75) {
            sparks.push(new Particle(
              this.x,
              this.y,
              '#ffa',
              0.3 + Math.random() * 0.5,
              Math.PI/2 + (Math.random()-0.5)*0.6,
              'sparkle'
            ));
          }

          if (this.y <= this.targetY) this.explode();
        }
        for (var i = this.trail.length - 1; i >= 0; i--) {
          this.trail[i].alpha -= 0.07;
          if (this.trail[i].alpha <= 0) this.trail.splice(i, 1);
        }
      };

      Rocket.prototype.explode = function() {
        this.exploded = true;
        var count = 40 + Math.floor(Math.random() * 20);
        for (var i = 0; i < count; i++) {
          var a = (Math.PI * 2 / count) * i + (Math.random() - 0.5) * 0.4;
          var sp = 2 + Math.random() * 4;
          particles.push(new Particle(this.x, this.y, this.color, sp, a));
        }
        var c2 = colors[Math.floor(Math.random() * colors.length)];
        for (var j = 0; j < 12; j++) {
          particles.push(new Particle(
            this.x, this.y, c2,
            1 + Math.random() * 2,
            Math.random() * Math.PI * 2,
            'sparkle'
          ));
        }
      };

      Rocket.prototype.draw = function() {
        for (var i = 0; i < this.trail.length; i++) {
          var t = this.trail[i];
          ctx.save();
          ctx.globalAlpha = t.alpha;
          ctx.fillStyle = '#ffe';
          ctx.beginPath();
          ctx.arc(t.x, t.y, 1.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        if (!this.exploded) {
          ctx.save();
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      };

      // Залп: 2 ракеты
      for (var i = 0; i < 2; i++) rockets.push(new Rocket());

      // Каждые 700мс по 1 ракете
      var rocketTimer = setInterval(function() {
        rockets.push(new Rocket());
      }, 700);

      // Через 4с прекращаем
      setTimeout(function() { clearInterval(rocketTimer); }, 4000);
      // Через 7с стоп
      setTimeout(function() {
        animating = false;
        // Очищаем canvas чтобы не нагружать GPU
        setTimeout(function() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }, 2000);
      }, 7000);

      function animate() {
        if (!animating && particles.length === 0 && rockets.length === 0 && sparks.length === 0) return;

        // Шлейфы
        ctx.fillStyle = 'rgba(10, 10, 26, 0.14)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (var r = rockets.length - 1; r >= 0; r--) {
          rockets[r].update();
          rockets[r].draw();
          if (rockets[r].exploded && rockets[r].trail.length === 0) rockets.splice(r, 1);
        }

        for (var p = particles.length - 1; p >= 0; p--) {
          particles[p].update();
          particles[p].draw();
          if (particles[p].alpha <= 0) particles.splice(p, 1);
        }

        for (var s = sparks.length - 1; s >= 0; s--) {
          sparks[s].update();
          sparks[s].draw();
          if (sparks[s].alpha <= 0) sparks.splice(s, 1);
        }

        requestAnimationFrame(animate);
      }

      animate();

      window.addEventListener('resize', function() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      });
    }
  </script>
